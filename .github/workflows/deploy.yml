# Pubblica il sito su Tophost a ogni merge su main (o a mano da Actions → Run workflow).
# Impostazioni (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (secret)   accesso FTP di Tophost
#   FTP_DIR                                  (variable) cartella del sito, es. /www.entratadisicurezza.com/buonapp/
#   FTP_SECURITY                             (variable) "loose" se il certificato TLS non corrisponde al nome host
# Non cancella nulla sul server e non carica mai src/config.php, migrations/, tests/ e i file di documentazione.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prova:
        description: "Prova a vuoto: mostra cosa caricherebbe senza caricare nulla"
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Controlla la sintassi PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Prove
        run: php tests/run.php

      - name: Installa lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Carica via FTP su TLS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR }}
          FTP_SECURITY: ${{ vars.FTP_SECURITY }}
          PROVA: ${{ github.event_name == 'workflow_dispatch' && inputs.prova }}
        run: |
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_DIR; do
            if [ -z "${!v}" ]; then echo "::error::Manca $v nelle impostazioni di GitHub Actions"; exit 1; fi
          done
          case "$FTP_DIR" in */) ;; *) FTP_DIR="$FTP_DIR/" ;; esac
          verifica=yes
          [ "$FTP_SECURITY" = "loose" ] && verifica=no
          opzioni="--reverse --only-newer --verbose --parallel=2"
          [ "$PROVA" = "true" ] && opzioni="$opzioni --dry-run" && echo "Prova a vuoto: nessun file verrà caricato."
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<FINE
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate $verifica
          set net:max-retries 3
          set net:timeout 30
          mirror $opzioni \
            --exclude-glob .git/ --exclude-glob .github/ --exclude-glob tests/ --exclude-glob migrations/ \
            --exclude-glob .gitignore --exclude-glob .gitattributes \
            --exclude-glob README.md --exclude-glob SVILUPPO.md \
            --exclude-glob src/config.php --exclude-glob .DS_Store \
            ./ "$FTP_DIR"
          bye
          FINE
